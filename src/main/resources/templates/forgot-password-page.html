<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Forgot Password</h3>
                </div>
                <div class="card-body p-4">

                    <!-- Forgot Password Form -->
                    <form th:action="@{/auth/forgot-password}" th:object="${user}" method="post">

                        <input type="hidden" name="_csrf" th:value="${csrfToken}" />

                        <!-- Global (non-field) messages -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="alert alert-success text-center mb-0"></p>
                        </div>

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required />
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Send Reset Link</button>
                        </div>

                    </form>

                    <!-- Link to Login -->
                    <div class="text-center mt-3">
                        <form th:action="@{/auth/login-page}" method="get">
                            <button type="submit" class="btn btn-link">Back to Login</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

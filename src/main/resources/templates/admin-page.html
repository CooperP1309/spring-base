<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
</head>
<body>

<h1>Admin Dashboard</h1>

<p><a th:href="@{/admin/dashboard}">Refresh users</a></p>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Full name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Verified</th>
            <th>Created</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.fullName}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.role}"></td>
            <td th:text="${user.emailVerified}"></td>
            <td th:text="${#dates.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:if="${user.role.name() != 'ADMIN'}">
                <form method="post" th:action="@{/auth/set-account-enabled}" style="display:inline">
                    <input type="hidden" name="email" th:value="${user.email}" />
                    <input type="hidden" name="enabled" th:value="${!user.emailVerified}" />
                    <button type="submit" th:text="${user.emailVerified} ? 'Disable account' : 'Enable account'"></button>
                </form>
                <form method="post" th:action="@{/admin/delete-user/{id}(id=${user.id})}"
                      onsubmit="return confirm('Delete this user?')" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>

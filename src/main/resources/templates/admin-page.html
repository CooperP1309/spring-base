<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <!-- Source the JS for handling admin dashboard functionality -->
    <script th:src="@{/js/admin.js}" defer></script>
</head>
<body>

<h1>Admin Dashboard</h1>

<div id="adminConfig"
     th:data-get-users-url="@{/admin/get-users}"
     th:data-delete-user-url="@{/admin/delete-user}"
     th:data-set-account-enabled-url="@{/auth/set-account-enabled}">
</div>

<button type="button" id="refreshBtn">Refresh users</button>
<p id="status"></p>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Full name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Verified</th>
            <th>Created</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="userRows"></tbody>
</table>

</body>
</html>

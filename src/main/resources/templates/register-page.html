<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Account</title>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Create an Account</h3>
                </div>
                <div class="card-body p-4">

                    <!-- Registration Form -->
                    <form th:action="@{/auth/test-register}" th:object="${user}" method="post">

                        <!-- Full Name Field -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Jane Doe" required />
                        </div>

                        <!-- Email Field -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required />
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="********" required />
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Register</button>
                        </div>
                        
                    </form>

                    <!-- Link to Login -->
                    <div class="text-center mt-3">
                        <p class="mb-0">Already have an account? <a th:href="@{/auth/login-page}">Login here</a></p>
                    </div>

                    <!-- Email Verification Result -->
                    <div th:if="${not #strings.isEmpty(user.email)}" class="mt-3">
                        <p th:if="${emailValid}" class="alert alert-success text-center mb-0">Verification Email Sent</p>
                        <p th:unless="${emailValid}" class="alert alert-danger text-center mb-0">Invalid Email Provided</p>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>

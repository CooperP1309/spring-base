<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Reset Password</h3>
                </div>
                <div class="card-body p-4">

                    <!-- Invalid or expired link -->
                    <div th:if="${secretInvalid}">
                        <p class="alert alert-danger text-center mb-3">
                            This password reset link is invalid or has expired.
                        </p>
                        <div class="text-center">
                            <a th:href="@{/auth/forgot-password}">Request a new link</a>
                        </div>
                    </div>

                    <!-- Reset success -->
                    <div th:if="${resetSuccess}">
                        <p class="alert alert-success text-center mb-3">
                            Your password has been reset.
                        </p>
                        <div class="text-center">
                            <a th:href="@{/auth/login-page}">Back to Login</a>
                        </div>
                    </div>

                    <!-- Reset Password Form -->
                    <form th:if="${!secretInvalid and !resetSuccess}"
                          th:action="@{/auth/reset-password/{secret}(secret=${secret})}"
                          th:object="${user}" method="post">

                        <!-- Global (non-field) errors -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="mb-3">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="alert alert-danger text-center mb-0"></p>
                        </div>

                        <!-- Password Field -->
                        <div class="mb-3">
                            <label for="password" class="form-label">New Password</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="********" required />
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1">
                                <p th:each="err : ${#fields.errors('password')}" th:text="${err}" class="mb-0"></p>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                        </div>

                    </form>

                    <!-- Link to Login -->
                    <div th:if="${!secretInvalid and !resetSuccess}" class="text-center mt-3">
                        <form th:action="@{/auth/login-page}" method="get">
                            <button type="submit" class="btn btn-link">Back to Login</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
